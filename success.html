<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Your ToyNest demo order is confirmed."><title>Order Confirmed | ToyNest</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><link href="css/responsive.css" rel="stylesheet"></head>
<body><div id="site-header"></div><main class="page-main"><section class="success-section container"><div class="success-icon"><i class="bi bi-check-lg"></i><span class="success-spark spark-one">✦</span><span class="success-spark spark-two">✦</span></div><span class="eyebrow">Happy play is on its way</span><h1>Thank you for your order!</h1><p class="success-lead">Your demo order is in the nest. We hope it brings a whole lot of smiles.</p><div id="order-details" class="order-confirmation-card"></div><div class="d-flex justify-content-center gap-3 flex-wrap mt-4"><a href="shop.html" class="btn btn-primary btn-pill">Continue shopping <i class="bi bi-arrow-right"></i></a><a href="index.html" class="btn btn-outline-primary btn-pill">Return to home</a></div><p class="demo-disclaimer success-disclaimer"><i class="bi bi-info-circle"></i> This is a frontend demo order. No payment or shipment was actually processed.</p></section></main><div id="site-footer"></div><div id="quick-view-modal" class="modal fade" tabindex="-1" aria-labelledby="quick-view-title" aria-hidden="true"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/products.js"></script><script src="js/common.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const order=ToyNest.getLastOrder();const target=document.getElementById('order-details');if(!order){target.innerHTML='<p class="mb-0">No recent order was found. <a href="shop.html">Browse our toys</a> to start a new adventure.</p>';return;}target.innerHTML=`<div class="order-number">Order number <strong>${ToyNest.escapeHTML(order.number)}</strong></div><div class="order-items">${order.items.map(item=>`<div><span>${ToyNest.escapeHTML(item.name)} <small>× ${item.quantity}</small></span><strong>${ToyNest.formatPrice(item.price*item.quantity)}</strong></div>`).join('')}</div><div class="order-total"><span>Order total</span><strong>${ToyNest.formatPrice(order.total)}</strong></div><p class="order-thanks">A confirmation for ${ToyNest.escapeHTML(order.email)} is shown here for demo purposes.</p>`;});</script></body></html>
